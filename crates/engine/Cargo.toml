[package]
name = "mixrelay-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
test-util = ["mixrelay-time/test-util"]

[dependencies]
mixrelay-driver-control = { path = "../driver-control" }
mixrelay-processor-state = { path = "../processor-state" }
tokio = { workspace = true, features = ["sync", "macros"] }
mixrelay-audio-engine = { path = "../audio-engine" }
mixrelay-audio-graph = { path = "../audio-graph" }
mixrelay-audio-io.workspace = true
mixrelay-control-protocol = { path = "../control-protocol" }
mixrelay-time = { path = "../time" }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing = "0.1.41"
sha2 = "0.10.9"

[dev-dependencies]
mixrelay-test-support = { path = "../test-support" }
mixrelay-time = { path = "../time", features = ["test-util"] }
allocation-counter = "0.8.1"
