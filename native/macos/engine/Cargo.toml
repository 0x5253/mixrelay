[package]
name = "mixrelay-macos-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[lints]
workspace = true

[features]
native-lab = []
test-util = ["mixrelay-macos-transport/test-observation", "mixrelay-time/test-util"]

[dependencies]
mixrelay-engine-core = { path = "../../../crates/engine-core" }
mixrelay-engine-host = { path = "../../common/engine-host" }
mixrelay-render = { path = "../../../crates/render" }
mixrelay-audio-graph = { path = "../../../crates/audio-graph" }
mixrelay-audio-io.workspace = true
mixrelay-control-protocol = { path = "../../../crates/control-protocol" }
mixrelay-driver-core = { path = "../../../crates/driver-core" }
mixrelay-time = { path = "../../../crates/time" }
mixrelay-realtime = { path = "../../../crates/realtime" }
mixrelay-pcm-ring = { path = "../../pcm-ring" }
mixrelay-macos-transport = { path = "../transport" }
mixrelay-macos-audio-io = { path = "../audio-io" }
parking_lot.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing = "0.1.41"
libc = "0.2.189"

[build-dependencies]
cc = "1.2.57"

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt"] }
allocation-counter = "0.8.1"
mixrelay-time = { path = "../../../crates/time", features = ["test-util"] }
mixrelay-test-support = { path = "../../../crates/test-support" }
mixrelay-macos-test-support = { path = "../../../crates/macos-test-support" }
mixrelay-macos-transport = { path = "../transport", features = ["test-observation"] }
