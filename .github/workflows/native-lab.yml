name: Native build and unit tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Manual main runs qualify release candidates and keep their own concurrency group.
# PR updates cancel their superseded runs.
concurrency:
  group: native-lab-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  support:
    # chore, ci and docs pull requests do not build.
    if: ${{ !startsWith(github.event.pull_request.title, 'chore') && !startsWith(github.event.pull_request.title, 'ci') && !startsWith(github.event.pull_request.title, 'docs') }}
    runs-on: ubuntu-24.04
    outputs:
      macos: ${{ github.event_name == 'pull_request' && steps.matrix.outputs.macosPullRequest || steps.matrix.outputs.macos }}
      linux: ${{ steps.matrix.outputs.linux }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: node scripts/support-contract.mjs check
      - name: Install archive inspection tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libarchive-tools
      - run: node --test scripts/support-contract.test.mjs scripts/qualification.test.mjs scripts/e2e/*.test.mjs scripts/prepare-release-manifest.test.mjs scripts/prepare-compiler-cache.test.mjs
      - id: matrix
        run: node scripts/support-contract.mjs matrix >> "$GITHUB_OUTPUT"

  native:
    needs: support
    name: ${{ matrix.id }} build and unit tests
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.support.outputs.macos) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    # sccache keeps compiled crates in the GitHub Actions cache between runs. Incremental
    # compilation is off so workspace crates are cacheable too.
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
      MIXRELAY_CI_TARGET: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Toolchain
        run: |
          npm install --global pnpm@11.9.0
          # The HAL bundle is universal: check:native also builds the Intel slice.
          rustup toolchain install 1.96.0 --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default 1.96.0
      - name: Select working remote or local compiler cache
        run: node scripts/prepare-compiler-cache.mjs
      - name: Verify hosted OS and CPU
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_MAJOR: ${{ matrix.version }}
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; import {execFileSync} from "node:child_process"; assert.equal(process.arch, process.env.EXPECTED_ARCH); assert.equal(execFileSync("sw_vers", ["-productVersion"], {encoding:"utf8"}).trim().split(".")[0], process.env.EXPECTED_MAJOR);'
      - run: pnpm install --frozen-lockfile
      # Pre-flight for the lab tooling itself; lab:test then runs the full macOS plan,
      # including `pnpm test:scripts` and `pnpm probe:macos-roundtrip --self-test`.
      - run: node --test scripts/lab/native-check.test.mjs scripts/lab/vm.test.mjs scripts/lab/guest-scripts.test.mjs scripts/lab/pipewire-cli.test.mjs
      - run: pnpm lab:test
      # Pull requests also build the unsigned universal app on the arm64 leg, so a pull
      # request holds two of the account's five macOS runners instead of three.
      # Icon Composer (.icon) assets need the actool that ships with Xcode 26 or later.
      # Releases pin Xcode 26 on macOS 26; this review build takes the newest Xcode it finds.
      - name: Select Xcode 26 or later for Icon Composer assets
        if: github.event_name == 'pull_request' && matrix.arch == 'arm64'
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app 2>/dev/null | awk -F'[_.]' '$2 >= 26' | sort -V | tail -n 1)"
          [[ -n "$xcode" ]] || { ls -d /Applications/Xcode*.app; echo "Xcode 26 or later is required" >&2; exit 1; }
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version
      - name: Build the universal app, remover and HAL driver ad-hoc signed
        if: github.event_name == 'pull_request' && matrix.arch == 'arm64'
        env:
          APPLE_SIGNING_IDENTITY: '-'
          MIXRELAY_CODESIGN_IDENTITY: '-'
        run: |
          zsh scripts/build-macos-universal-app.sh
          cargo run --locked -p mixrelay-macos-hal-bundle -- --output target/universal-apple-darwin/release/hal
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats
      - name: Collect scope and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: native-${{ matrix.id }}
          path: .lab/reports/
          include-hidden-files: true
          if-no-files-found: warn

  linux:
    needs: support
    name: ${{ matrix.id }} build and unit tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.support.outputs.linux) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Hosted runners ship toolchains this job never uses; the workspace build needs the space.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - run: node scripts/lab/distro-image.mjs ${{ matrix.distro }}
      - run: docker compose -f infra/lab/compose.yaml build ${{ matrix.distro }}
      # Full debug info for the whole workspace fills the hosted runner's disk; line tables
      # keep file:line in panics and backtraces.
      - name: Check the contract's native Linux CPU and distro
        env:
          CI_TARGET: ${{ matrix.id }}
        run: docker compose -f infra/lab/compose.yaml run --name mixrelay-ci-check -e MIXRELAY_CI_TARGET="$CI_TARGET" -e MIXRELAY_SOURCE_REVISION="$GITHUB_SHA" -e CARGO_PROFILE_DEV_DEBUG=line-tables-only ${{ matrix.distro }} test
      - name: Collect evidence even when a compile or test fails
        if: always()
        run: |
          mkdir -p .lab/reports
          if docker container inspect mixrelay-ci-check >/dev/null 2>&1; then
            docker cp mixrelay-ci-check:/workspace/.lab/reports/. .lab/reports/
          fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: linux-${{ matrix.id }}
          path: .lab/reports/
          include-hidden-files: true
          if-no-files-found: warn

  streamdeck:
    # chore, ci and docs pull requests do not build.
    if: ${{ !startsWith(github.event.pull_request.title, 'chore') && !startsWith(github.event.pull_request.title, 'ci') && !startsWith(github.event.pull_request.title, 'docs') }}
    name: Stream Deck build, regression tests and distributable
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm install --global pnpm@11.9.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/streamdeck-artifact.mjs build --output streamdeck-package
      - run: pnpm --filter @mixrelay/streamdeck-plugin test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: streamdeck-package
          path: streamdeck-package/*.streamDeckPlugin
          if-no-files-found: error

  passed:
    # The one required check for this workflow; skipped work (chore, ci, docs) passes.
    name: Native checks passed
    if: always()
    needs: [support, native, linux, streamdeck]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - env:
          GH_TOKEN: ${{ github.token }}
          SELF: Native checks passed
        run: bash scripts/ci/require-jobs-passed.sh
