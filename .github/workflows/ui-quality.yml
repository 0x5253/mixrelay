name: UI system and quality checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    # chore, ci and docs pull requests do not build.
    if: ${{ !startsWith(github.event.pull_request.title, 'chore') && !startsWith(github.event.pull_request.title, 'ci') && !startsWith(github.event.pull_request.title, 'docs') }}
    name: UI system boundaries, types, tests and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm install --global pnpm@11.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:ui-quality
      - run: pnpm notices:check
      - run: pnpm --filter @mixrelay/control-ui check

  passed:
    # The one required check for this workflow; skipped work (chore, ci, docs) passes.
    name: UI checks passed
    if: always()
    needs: [ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      # A matrix leg that never got a runner is not reported as cancelled through `needs`,
      # so read every job of this run attempt and accept only success or skipped.
      - env:
          GH_TOKEN: ${{ github.token }}
          SELF: UI checks passed
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate \
            --jq '.jobs[] | select(.name != env.SELF) | "\(.name)\t\(.status)\t\(.conclusion)"' > jobs.tsv
          cat jobs.tsv
          ! awk -F'\t' '$2 != "completed" || ($3 != "success" && $3 != "skipped")' jobs.tsv | grep .
