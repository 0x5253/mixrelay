name: Conventional PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Squash commit title follows Conventional Commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      # The squash commit on main takes the PR title, but this repository's squash setting
      # keeps the commit subject for a single-commit PR, so that subject is checked too.
      - name: Check the title release-please will read
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMIT_COUNT: ${{ github.event.pull_request.commits }}
        run: |
          titles=("$PR_TITLE")
          if [[ "$COMMIT_COUNT" == 1 ]]; then
            titles+=("$(git log -1 --format=%s HEAD)")
          fi
          node scripts/check-conventional-title.mjs "${titles[@]}"
