name: Pull request build (unsigned)

# Builds the Linux release packages for review without signing secrets. The unsigned
# macOS app is built by the arm64 pull request leg of native-lab.yml, which already holds
# a macOS runner. PKG signing and notarization run only in release.yml behind the
# approved release environment.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # chore, ci and docs pull requests do not build.
    if: ${{ !startsWith(github.event.pull_request.title, 'chore') && !startsWith(github.event.pull_request.title, 'ci') && !startsWith(github.event.pull_request.title, 'docs') }}
    uses: ./.github/workflows/build-linux-release.yml
    with:
      source_ref: ${{ github.sha }}

  passed:
    # The one required check for this workflow; skipped work (chore, ci, docs) passes.
    name: Unsigned build passed
    if: always()
    needs: [linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      # A matrix leg that never got a runner is not reported as cancelled through `needs`,
      # so read every job of this run attempt and accept only success or skipped.
      - env:
          GH_TOKEN: ${{ github.token }}
          SELF: Unsigned build passed
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate \
            --jq '.jobs[] | select(.name != env.SELF) | "\(.name)\t\(.status)\t\(.conclusion)"' > jobs.tsv
          cat jobs.tsv
          ! awk -F'\t' '$2 != "completed" || ($3 != "success" && $3 != "skipped")' jobs.tsv | grep .
