name: Pull request build (unsigned)

# Builds every release product for review without signing secrets: Linux packages
# as released, macOS apps ad-hoc signed. PKG signing and notarization run only in
# release.yml behind the approved release environment.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # chore, ci and docs pull requests do not build.
    if: ${{ !startsWith(github.event.pull_request.title, 'chore') && !startsWith(github.event.pull_request.title, 'ci') && !startsWith(github.event.pull_request.title, 'docs') }}
    uses: ./.github/workflows/build-linux-release.yml
    with:
      source_ref: ${{ github.sha }}

  macos:
    # chore, ci and docs pull requests do not build.
    if: ${{ !startsWith(github.event.pull_request.title, 'chore') && !startsWith(github.event.pull_request.title, 'ci') && !startsWith(github.event.pull_request.title, 'docs') }}
    # Icon Composer assets compile only on a macOS 26 host with Xcode 26.
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Select Xcode 26 for Icon Composer assets
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          [[ -n "$xcode" ]] || { ls -d /Applications/Xcode*.app; echo "Xcode 26 is required" >&2; exit 1; }
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version
      - name: Install the universal build toolchain
        run: |
          npm install --global pnpm@11.9.0
          rustup toolchain install 1.96.0 --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default 1.96.0
          pnpm install --frozen-lockfile
      - name: Build the universal app, remover and HAL driver ad-hoc signed
        env:
          APPLE_SIGNING_IDENTITY: '-'
          MIXRELAY_CODESIGN_IDENTITY: '-'
        run: |
          zsh scripts/build-macos-universal-app.sh
          cargo run --locked -p mixrelay-hal-bundle -- --output target/universal-apple-darwin/release/hal

  passed:
    # The one required check for this workflow; skipped work (chore, ci, docs) passes.
    name: Unsigned build passed
    if: always()
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == false ]]
