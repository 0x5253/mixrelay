name: Release PR and official release

# Merged pull requests accumulate in one release PR. Merging that release PR is the
# only event that tags a version and builds the official installers.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: github.repository == '0x5253/mixrelay'
    # RELEASE_PLEASE_TOKEN exists only in this environment, which opens on main alone.
    environment: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      pr: ${{ steps.release.outputs.pr }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A non-default token lets the release PR run its required checks like any PR.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  product-version:
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    environment: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
    steps:
      - name: Accept only the release-please branch
        run: '[[ "$RELEASE_BRANCH" =~ ^release-please--[A-Za-z0-9._/-]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      # release-please writes only its manifest; the project tool sets every versioned file.
      - name: Set the release version in every product manifest
        run: |
          set -euo pipefail
          version="$(jq -er '.["."]' .release-please-manifest.json)"
          node scripts/product-version.mjs set "$version"
          if git diff --quiet; then
            echo "Release branch already carries MixRelay $version"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --all --quiet --message "chore: set product version to $version"
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"

  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    # A called workflow sees its environment's secrets only when the caller inherits.
    # This job holds no secrets itself, so only the release environment's values reach release.yml.
    secrets: inherit
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}
