name: Build Linux release candidates once per CPU

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      # Reviews check that packages compile, link and bundle without whole-program optimization.
      review_build:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  support:
    if: github.repository == '0x5253/mixrelay'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.linuxBuild }}
      arch: ${{ steps.matrix.outputs.archBuild }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: node scripts/support-contract.mjs check
      - id: matrix
        run: node scripts/support-contract.mjs matrix >> "$GITHUB_OUTPUT"
  deb:
    needs: support
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.support.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - run: docker compose -f infra/lab/compose.yaml build ${{ matrix.distro }}
      - name: Build the final packages once on their native CPU
        env:
          ARCH_PACKAGE: ${{ matrix.archPackage }}
          BUNDLES: ${{ matrix.bundles }}
          REVIEW_BUILD: ${{ inputs.review_build }}
        run: >-
          docker compose -f infra/lab/compose.yaml run --name mixrelay-release-build
          -e ARCH_PACKAGE="$ARCH_PACKAGE" -e BUNDLES="$BUNDLES" -e REVIEW_BUILD="$REVIEW_BUILD"
          --entrypoint bash ${{ matrix.distro }}
          -c 'set -euo pipefail;
          if [ "$REVIEW_BUILD" = true ]; then export CARGO_PROFILE_RELEASE_LTO=off CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16; fi;
          pnpm desktop:build --bundles "$BUNDLES";
          version=$(node --input-type=module -e "import {checkVersion} from \"./scripts/product-version.mjs\"; console.log(checkVersion())");
          for package in target/release/bundle/deb/*.deb; do
          test "$(dpkg-deb --field "$package" Version)" = "$version";
          done;
          for package in target/release/bundle/rpm/*.rpm; do
          test "$(rpm -qp --queryformat %{VERSION} "$package")" = "$version";
          done;
          if [ -n "$ARCH_PACKAGE" ]; then
          node scripts/prepare-arch-driver-package.mjs target/release/bundle/deb/*.deb target/arch-recipe;
          fi'
      - name: Collect inspected final packages
        env:
          RPM_ID: ${{ matrix.rpm }}
        run: |
          mkdir -p candidate
          docker cp mixrelay-release-build:/workspace/target/release/bundle/deb/. candidate/
          git rev-parse HEAD > candidate/source-revision.txt
          (cd candidate && sha256sum *.deb > SHA256SUMS-${{ matrix.id }})
          if [[ -n "$RPM_ID" ]]; then
            mkdir -p candidate-rpm
            docker cp mixrelay-release-build:/workspace/target/release/bundle/rpm/. candidate-rpm/
            cp candidate/source-revision.txt candidate-rpm/
            (cd candidate-rpm && sha256sum *.rpm > "SHA256SUMS-$RPM_ID")
          fi
      - name: Prepare Arch wrapper from the same DEB payload
        if: matrix.archPackage != ''
        run: |
          mkdir arch-recipe
          docker cp mixrelay-release-build:/workspace/target/arch-recipe/. arch-recipe/
      - if: matrix.archPackage != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: arch-recipe-${{ matrix.archPackage }}
          path: arch-recipe/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: candidate-${{ matrix.id }}
          path: candidate/
          if-no-files-found: error
      - if: matrix.rpm != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: candidate-${{ matrix.rpm }}
          path: candidate-rpm/
          if-no-files-found: error
  arch:
    needs: [support, deb]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.support.outputs.arch) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arch-recipe-${{ matrix.id }}
          path: packaging/linux/candidate-input
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libarchive-tools
      - run: node scripts/lab/distro-image.mjs ${{ matrix.distro }}
      - run: docker compose -f infra/lab/compose.yaml build ${{ matrix.distro }}
      # Arch Linux ARM's makepkg.conf still defaults to xz; the release asset name is zstd.
      - name: Wrap the checked DEB payload without compiling or stripping
        run: docker compose -f infra/lab/compose.yaml run --name mixrelay-arch-wrap --entrypoint bash ${{ matrix.distro }} -c 'cd packaging/linux/candidate-input && PKGEXT=.pkg.tar.zst makepkg --nodeps --noconfirm'
      - env:
          PKGARCH: ${{ matrix.pkgarch }}
          ARTIFACT: ${{ matrix.id }}
        run: |
          mkdir candidate
          docker cp mixrelay-arch-wrap:/workspace/packaging/linux/candidate-input/. candidate/
          version="$(node --input-type=module -e 'import {checkVersion} from "./scripts/product-version.mjs"; console.log(checkVersion())')"
          for package in candidate/*.pkg.tar.zst; do
            bsdtar -xOf "$package" .PKGINFO | grep -Fx "pkgver = $version-1"
            bsdtar -xOf "$package" .PKGINFO | grep -Fx "arch = $PKGARCH"
          done
          (cd candidate && sha256sum *.pkg.tar.zst > "SHA256SUMS-$ARTIFACT")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: candidate-${{ matrix.id }}
          path: |
            candidate/*.pkg.tar.zst
            candidate/SHA256SUMS-${{ matrix.id }}
          if-no-files-found: error
