name: Qualification VM readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - support/environments.json
      - scripts/e2e/**
      - scripts/support-contract.mjs
      - .github/workflows/qualification-hosts.yml

permissions:
  contents: read

concurrency:
  group: qualification-hosts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    # chore, ci and docs pull requests do not build.
    if: ${{ !startsWith(github.event.pull_request.title, 'chore') && !startsWith(github.event.pull_request.title, 'ci') && !startsWith(github.event.pull_request.title, 'docs') }}
    runs-on: ubuntu-24.04
    outputs:
      linux: ${{ steps.matrix.outputs.linux }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        run: |
          node --input-type=module -e 'import {loadContract,qualificationMatrix} from "./scripts/support-contract.mjs"; console.log("linux="+JSON.stringify({include:qualificationMatrix(loadContract().contract).include.filter(t=>t.os==="linux")}));' >> "$GITHUB_OUTPUT"
  boot:
    needs: matrix
    name: Boot ${{ matrix.id }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.linux) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Prepare VM tools
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: bash scripts/e2e/github-vm-tools.sh "$TARGET_ARCH"
      - name: Boot actual distro and check desktop audio prerequisites
        env:
          TARGET: ${{ matrix.id }}
        run: node scripts/e2e/github-vm.mjs --target "$TARGET" --output evidence --smoke
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: host-readiness-${{ matrix.id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error

  passed:
    # The one required check for this workflow; skipped work (chore, ci, docs) passes.
    name: Qualification hosts passed
    if: always()
    needs: [matrix, boot]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - env:
          GH_TOKEN: ${{ github.token }}
          SELF: Qualification hosts passed
        run: bash scripts/ci/require-jobs-passed.sh
